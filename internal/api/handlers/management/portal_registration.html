<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>注册 · CliRelay</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#242b29;background:#f5f6f4;font-synthesis:none;color-scheme:light;--paper:#fff;--line:#d9dfda;--muted:#647069;--accent:#226747;--field:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100svh}a{color:var(--accent);text-underline-offset:4px}button,input,select{font:inherit}header{max-width:1080px;margin:auto;padding:26px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:20px;font-weight:700;letter-spacing:-.6px;text-decoration:none;color:inherit}.brand span{color:var(--accent)}select{color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px}main{width:min(100% - 32px,460px);margin:34px auto 64px}.intro{margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:1.2px;color:var(--muted);margin:0 0 12px}h1{font-size:28px;font-weight:650;letter-spacing:-.8px;margin:0 0 12px;line-height:1.3}.subtitle{color:var(--muted);font-size:14px;line-height:1.7;margin:0}.card{border:1px solid var(--line);border-radius:12px;padding:28px;background:var(--paper)}fieldset{border:0;padding:0;margin:0;min-width:0}.field{margin-bottom:19px}label{display:block;font-size:14px;font-weight:550;margin-bottom:8px}.optional{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}input:not([type=checkbox]){width:100%;height:43px;padding:9px 12px;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:6px;outline-offset:3px}input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}input:disabled{opacity:.65}.hint{font-size:12px;line-height:1.6;color:var(--muted);margin:7px 0 0}.show{display:flex;gap:8px;align-items:center;margin:0 0 22px;font-size:13px;font-weight:400}.show input{margin:0;accent-color:var(--accent)}button,.button{display:block;width:100%;padding:12px 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}button:hover,.button:hover{filter:brightness(1.08)}button:disabled{opacity:.5;cursor:wait}.signin{margin:22px 0 0;text-align:center;font-size:13px;color:var(--muted)}.notice{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 20px}.notice.error{color:#a12d2d;background:#fff2f0;border-radius:6px;padding:12px}.success-mark{display:grid;place-items:center;width:40px;height:40px;background:#e6f1e9;color:var(--accent);border-radius:50%;font-size:22px;margin-bottom:18px}.success h2{font-size:23px;margin:0 0 12px}.success p{font-size:14px;color:var(--muted);line-height:1.8;margin:0 0 24px}[hidden]{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px;line-height:1.6}
    @media(max-width:520px){header{padding:22px 20px}main{margin-top:24px}.card{padding:24px}h1{font-size:26px}}
    @media(prefers-color-scheme:dark){:root{color:#e6ede8;background:#151a17;--paper:#1d2420;--line:#39453d;--muted:#a1afa5;--accent:#76b991;--field:#18201b;color-scheme:dark}button,.button{color:#13281c}.notice.error{color:#ffb4a9;background:#3c2422}.success-mark{background:#2a3c30}}
    @media(prefers-reduced-motion:no-preference){button,a{transition:filter .15s}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/manage/#/apikey-lookup">Cli<span>Relay</span></a>
    <select id="language" aria-label="Language / 语言 / Язык"><option value="zh">简体中文</option><option value="en">English</option><option value="ru">Русский</option></select>
  </header>
  <main>
    <div class="intro"><p class="eyebrow">CLIRELAY / PORTAL</p><h1 data-i18n="title">创建你的账号</h1><p class="subtitle" data-i18n="subtitle">一个账号，管理你的 API Key 和模型用量。</p></div>
    <section class="card" aria-labelledby="form-heading">
      <form id="registration" method="post" action="/v0/portal/auth/register">
        <h2 id="form-heading" hidden data-i18n="title">创建你的账号</h2>
        <p id="notice" class="notice" role="status" tabindex="-1" data-i18n="checking">正在检查注册状态…</p>
        <fieldset id="fields" disabled>
          <div class="field"><label for="username" data-i18n="username">用户名</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="48" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,47}" aria-describedby="username-hint"><p class="hint" id="username-hint" data-i18n="usernameHint">3–48 位字母、数字、点、下划线或短横线，以字母或数字开头。</p></div>
          <div class="field"><label for="display-name"><span data-i18n="displayName">昵称</span><span class="optional" data-i18n="optional">选填</span></label><input id="display-name" name="display_name" autocomplete="nickname" maxlength="128"></div>
          <div class="field"><label for="password" data-i18n="password">密码</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="72" aria-describedby="password-hint"><p class="hint" id="password-hint" data-i18n="passwordHint">至少 12 位，包含大写字母、小写字母和符号。</p></div>
          <div class="field"><label for="confirm-password" data-i18n="confirm">确认密码</label><input id="confirm-password" type="password" autocomplete="new-password" required maxlength="72"></div>
          <label class="show"><input id="show-password" type="checkbox"><span data-i18n="show">显示密码</span></label>
          <button id="submit" type="submit" data-i18n="submit">创建账号</button>
        </fieldset>
        <p class="signin"><span data-i18n="existing">已有账号？</span> <a href="/manage/#/apikey-lookup" data-i18n="login">前往登录</a></p>
      </form>
      <div class="success" id="success" role="status" tabindex="-1" hidden><div class="success-mark" aria-hidden="true">✓</div><h2 data-i18n="successTitle">账号已创建</h2><p data-i18n="successBody">现在可以使用刚才的用户名和密码登录用户门户，查看 API Key 和用量。</p><a class="button" href="/manage/#/apikey-lookup" data-i18n="login">前往登录</a></div>
    </section>
    <footer data-i18n="footer">你的 API Key 和用量，统一管理。</footer>
    <noscript><p>请启用 JavaScript 后注册。 Please enable JavaScript to register.</p></noscript>
  </main>
  <script>
    'use strict';
    const copy = {
      zh:{title:'创建你的账号',subtitle:'一个账号，管理你的 API Key 和模型用量。',username:'用户名',usernameHint:'3–48 位字母、数字、点、下划线或短横线，以字母或数字开头。',displayName:'昵称',optional:'选填',password:'密码',passwordHint:'至少 {min} 位，包含大写字母、小写字母和符号。',confirm:'确认密码',show:'显示密码',submit:'创建账号',submitting:'正在创建…',existing:'已有账号？',login:'前往登录',checking:'正在检查注册状态…',registration_disabled:'暂未开放注册，请联系管理员。',registration_unavailable:'暂时无法注册，请稍后重试。',username_taken:'用户名已被使用，请换一个。',validation_failed:'请检查用户名、昵称和密码的格式，昵称最多 128 字节。',password_too_short:'密码至少需要 {min} 位。',password_too_long:'密码过长，请减少字符。',password_missing_upper:'密码需要包含大写字母。',password_missing_lower:'密码需要包含小写字母。',password_missing_special:'密码需要包含符号。',mismatch:'两次输入的密码不一致。',too_many_requests:'注册操作过于频繁，请在 {seconds} 秒后重试。',network:'连接失败，请检查网络后重试。',successTitle:'账号已创建',successBody:'现在可以使用刚才的用户名和密码登录用户门户，查看 API Key 和用量。',footer:'你的 API Key 和用量，统一管理。'},
      en:{title:'Create your account',subtitle:'One place for your API keys and model usage.',username:'Username',usernameHint:'3–48 letters, numbers, dots, underscores or hyphens. Start with a letter or number.',displayName:'Display name',optional:'Optional',password:'Password',passwordHint:'At least {min} characters with uppercase, lowercase and a symbol.',confirm:'Confirm password',show:'Show password',submit:'Create account',submitting:'Creating account…',existing:'Already have an account?',login:'Sign in',checking:'Checking registration availability…',registration_disabled:'Registration is closed. Please contact the administrator.',registration_unavailable:'Registration is temporarily unavailable. Please try again later.',username_taken:'This username is taken. Please choose another.',validation_failed:'Check your username, display name and password. Display names may use up to 128 bytes.',password_too_short:'Use at least {min} characters for your password.',password_too_long:'Your password is too long. Please use fewer characters.',password_missing_upper:'Include an uppercase letter.',password_missing_lower:'Include a lowercase letter.',password_missing_special:'Include a symbol.',mismatch:'The passwords do not match.',too_many_requests:'Too many registration attempts. Try again in {seconds} seconds.',network:'Connection failed. Check your network and try again.',successTitle:'Your account is ready',successBody:'Sign in to the user portal with your new username and password to view your API keys and usage.',footer:'Your API keys and usage, together.'},
      ru:{title:'Создать аккаунт',subtitle:'Ваши API-ключи и статистика использования в одном месте.',username:'Имя пользователя',usernameHint:'3–48 латинских букв, цифр, точек, подчёркиваний или дефисов. Начните с буквы или цифры.',displayName:'Отображаемое имя',optional:'Необязательно',password:'Пароль',passwordHint:'Не менее {min} символов: заглавная и строчная буквы и специальный символ.',confirm:'Повторите пароль',show:'Показать пароль',submit:'Создать аккаунт',submitting:'Создание аккаунта…',existing:'Уже есть аккаунт?',login:'Войти',checking:'Проверка доступности регистрации…',registration_disabled:'Регистрация закрыта. Обратитесь к администратору.',registration_unavailable:'Регистрация временно недоступна. Попробуйте позже.',username_taken:'Это имя уже занято. Выберите другое.',validation_failed:'Проверьте имя пользователя, отображаемое имя и пароль. Имя — до 128 байт.',password_too_short:'Пароль должен содержать не менее {min} символов.',password_too_long:'Пароль слишком длинный. Используйте меньше символов.',password_missing_upper:'Добавьте заглавную букву.',password_missing_lower:'Добавьте строчную букву.',password_missing_special:'Добавьте специальный символ.',mismatch:'Пароли не совпадают.',too_many_requests:'Слишком много попыток. Повторите через {seconds} секунд.',network:'Ошибка соединения. Проверьте сеть и повторите попытку.',successTitle:'Аккаунт создан',successBody:'Войдите в пользовательский портал с новым именем и паролем, чтобы просмотреть API-ключи и статистику.',footer:'Ваши API-ключи и статистика в одном месте.'}
    };
    const byId = id => document.getElementById(id);
    const form = byId('registration'), fields = byId('fields'), notice = byId('notice');
    const password = byId('password'), confirm = byId('confirm-password');
    const initialLanguage = navigator.language.toLowerCase();
    let language = initialLanguage.startsWith('zh') ? 'zh' : initialLanguage.startsWith('ru') ? 'ru' : 'en';
    let enabled = false, busy = false, min = 12, max = 72, noticeKey = 'checking', retrySeconds = 0;
    function t(key){return (copy[language][key] || copy[language].registration_unavailable).replace('{min}', min).replace('{seconds}', retrySeconds);}
    function render(){
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : language;
      document.title = t('title') + ' · CliRelay';
      byId('language').value = language;
      document.querySelectorAll('[data-i18n]').forEach(element => {element.textContent = t(element.dataset.i18n);});
      notice.hidden = !noticeKey;
      notice.textContent = noticeKey ? t(noticeKey) : '';
      notice.classList.toggle('error', !!noticeKey && noticeKey !== 'checking');
      byId('submit').textContent = t(busy ? 'submitting' : 'submit');
      fields.disabled = busy || !enabled;
      confirm.setCustomValidity(confirm.value && confirm.value !== password.value ? t('mismatch') : '');
    }
    function showError(key){noticeKey = key;render();notice.focus();}
    byId('language').addEventListener('change', event => {language = event.target.value;render();});
    byId('show-password').addEventListener('change', event => {password.type = confirm.type = event.target.checked ? 'text' : 'password';});
    [password, confirm].forEach(input => input.addEventListener('input', () => {confirm.setCustomValidity(confirm.value && confirm.value !== password.value ? t('mismatch') : '');}));
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (busy || !enabled || !form.reportValidity()) return;
      if (new TextEncoder().encode(password.value).length > max){showError('password_too_long');return;}
      busy = true;noticeKey = '';render();
      try{
        const response = await fetch('/v0/portal/auth/register', {method:'POST',headers:{'Content-Type':'application/json'},credentials:'omit',cache:'no-store',body:JSON.stringify({username:byId('username').value.trim(),display_name:byId('display-name').value.trim(),password:password.value})});
        if (response.status === 201){
          form.reset();form.hidden = true;byId('success').hidden = false;byId('success').focus();return;
        }
        let data = {};try{data = await response.json();}catch{}
        retrySeconds = Math.max(1, Number(response.headers.get('Retry-After')) || 900);
        const key = response.status === 429 ? 'too_many_requests' : data.error?.code;
        if (key === 'registration_disabled') enabled = false;
        showError(copy[language][key] ? key : 'registration_unavailable');
      }catch{showError('network');}
      finally{busy = false;render();}
    });
    async function initialize(){
      render();
      try{
        const response = await fetch('/v0/portal/auth/registration', {credentials:'omit',cache:'no-store'});
        if (!response.ok) throw new Error('unavailable');
        const data = await response.json();
        min = data.password_min_length;max = data.password_max_bytes;password.minLength = min;
        enabled = data.enabled === true;noticeKey = enabled ? '' : 'registration_disabled';render();
      }catch{showError('registration_unavailable');}
    }
    initialize();
  </script>
</body>
</html>
